# Serves the built dashboard and proxies the API on the same origin, so the browser needs no CORS.
# (In development, Vite's proxy in vite.config.ts does the same job.)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
    }

    # SignalR upgrades to a WebSocket, which needs the Upgrade/Connection headers passed through.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
