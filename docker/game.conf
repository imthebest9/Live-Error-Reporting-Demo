# Serves the demo game and the SDK as plain static files: /game/ and /sdk/errors-sdk.js.
# /api/leaderboard deliberately doesn't exist here, which is what the "Failing fetch" button relies on.
server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off; # keep redirects relative, so they don't lose the published port (8081)

    location = / {
        return 302 /game/;
    }
}
